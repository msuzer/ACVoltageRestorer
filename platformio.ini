; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -O3
    -DCORE_DEBUG_LEVEL=0

; Bench-test only: forces system health to "OK" so you can observe PWM/ADC output without
; the +15V interlock chain wired up. Select this env explicitly; never use it for real power tests.
[env:esp32dev_bypass_safety]
extends = env:esp32dev
build_flags = 
    ${env:esp32dev.build_flags}
    -DBYPASS_SAFETY_INTERLOCK